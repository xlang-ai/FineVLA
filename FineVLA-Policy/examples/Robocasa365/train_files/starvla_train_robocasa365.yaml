run_id: robocasa365_qwenoft
run_root_dir: ./results/Checkpoints
seed: 42
trackers:
- jsonl
- wandb
wandb_entity: jinhuiye
wandb_project: StarVLA_RoboCasa365
is_debug: false

framework:
  name: QwenOFT
  qwenvl:
    base_vlm: ./playground/Pretrained_models/Qwen3.5-VL-4B-Instruct-Action
    attn_implementation: flash_attention_2
    vl_hidden_dim: 2560
  action_model:
    action_model_type: MLP
    action_hidden_dim: 2560
    action_dim: 12
    state_dim: 16
    future_action_window_size: 15
    past_action_window_size: 0


datasets:
  vlm_data:
    dataset_py: vlm_datasets
    dataformat: llava_json
    dataset_use: sharegpt4v_coco
    eval_dataset: sharegpt4v_coco
    data_flatten: false
    base_interval: 2
    max_pixels: 12845056
    min_pixels: 3136
    model_max_length: 2048
    model_type: qwen3vl
    per_device_batch_size: 1

  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: playground/Datasets
    data_mix: robocasa365_single
    action_type: delta_ee
    CoT_prompt: "Your task is {instruction}."
    CoT_answer: null
    default_image_resolution: [3, 224, 224]
    per_device_batch_size: 8
    load_all_data_for_training: true
    obs: ["robot0_eye_in_hand", "robot0_agentview_left", "robot0_agentview_right"]
    image_size: [224, 224]
    video_backend: torchvision_av
    include_state: false

trainer:
  epochs: 100
  max_train_steps: 100000
  num_warmup_steps: 5000
  save_interval: 10000
  eval_interval: 1000
  learning_rate:
    base: 3.0e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: ''
  loss_scale:
    vla: 1.0
    vlm: 0.0
  max_grad_norm: 1.0
  warmup_ratio: 0.1
  weight_decay: 0.0
  logging_frequency: 50
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08

  is_resume: false
  resume_epoch: null
  resume_step: null
  enable_gradient_checkpointing: true
  enable_mixed_precision_training: true
